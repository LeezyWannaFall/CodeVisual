services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      MODE: development
    depends_on:
      db:
        condition: service_started
  worker:
    image: python:3.12-slim
    working_dir: /worker
    command: ["python", "main.py"]
    volumes:
      - ./worker:/worker:ro
    depends_on: [api]
  db:
    image: postgres:16
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data: {}
